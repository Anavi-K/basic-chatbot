[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anavi-K", email = "anavikothari@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.3",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.10",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
